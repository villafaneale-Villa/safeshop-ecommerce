<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B100C">
<title>SafeShop</title>
<style>
html,body{margin:0;min-height:100%;background:#0B100C;color:#F1EFE8;font-family:Arial,sans-serif}.boot{min-height:100vh;display:grid;place-items:center;text-align:center}.boot b{display:block;color:#526D3A;font-size:30px;letter-spacing:.08em}.boot span{display:block;margin-top:10px;color:#A8AEA5;font-size:13px}.err{max-width:520px;padding:24px;line-height:1.5}
</style>
<script src="https://cdn.jsdelivr.net/npm/pako@2.1.0/dist/pako.min.js"></script>
</head>
<body>
<div class="boot" id="boot"><div><b>SAFE SHOP</b><span>Cargando tienda…</span></div></div>
<script>
(async()=>{
  const boot=document.getElementById('boot');
  try{
    const payload=await fetch('./payload.html?v=2',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('payload '+r.status);return r.text()});
    const m=payload.match(/const b64=`([A-Za-z0-9+/=]+)`/);
    if(!m) throw new Error('No se encontró el contenido de la tienda');
    const raw=atob(m[1]);
    const bytes=Uint8Array.from(raw,c=>c.charCodeAt(0));
    let html;
    if('DecompressionStream' in window){
      const ds=new DecompressionStream('gzip');
      html=await new Response(new Blob([bytes]).stream().pipeThrough(ds)).text();
    }else{
      if(!window.pako) throw new Error('No se pudo cargar el descompresor');
      html=new TextDecoder().decode(window.pako.ungzip(bytes));
    }
    const latestFix=`<style id="claude-desktop-logo-fix">
@media(min-width:851px){
  .bar{height:auto!important;min-height:96px!important;padding-top:14px!important;padding-bottom:14px!important}
  .top .safeLogo.exactLogo img{width:132px!important;height:auto!important}
  .checkoutTop{height:auto!important;min-height:96px!important;padding:14px 0!important}
  .checkoutTop .safeLogo.exactLogo img{width:120px!important;height:auto!important}
}
</style>`;
    html=html.replace('</head>',latestFix+'</head>');
    document.open();
    document.write(html);
    document.close();
  }catch(e){
    console.error(e);
    boot.innerHTML='<div class="err"><b>SAFE SHOP</b><span>No se pudo cargar la tienda. Actualizá la página en unos segundos.</span></div>';
  }
})();
</script>
</body>
</html>
